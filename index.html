<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Codeoura</title>
<link rel="canonical" href="/codeoura-site/en/">
<meta http-equiv="refresh" content="0; url=/codeoura-site/en/">
<script>
  // English is the canonical landing: the meta refresh above sends everyone
  // there, and this only redirects the visitor whose browser actually asks
  // for one of the other two.
  var lang = (navigator.language || 'en').toLowerCase();
  var match = lang.indexOf('ar') === 0 ? 'ar' : lang.indexOf('tr') === 0 ? 'tr' : 'en';
  location.replace('/codeoura-site/' + match + '/');
</script>
</head>
<body>
<p>Redirecting to <a href="/codeoura-site/en/">Codeoura</a>.</p>
</body>
</html>
